<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../settle-tokens.css">
<link rel="stylesheet" href="../settle.css">
<script src="../settle-motion.js"></script>
<title>Button</title></head>
<body>
<div class="st-stage">
  <button class="st-btn st-btn-primary" type="button">Save changes</button>
  <button class="st-btn st-btn-secondary" type="button">
    <svg class="st-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    Add member
  </button>
  <button class="st-btn st-btn-quiet" type="button">Cancel</button>
  <button class="st-btn st-btn-secondary st-btn-icon" type="button" aria-label="Close">
    <svg class="st-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
  </button>
  <button class="st-btn st-btn-secondary st-btn-compact" type="button">Compact</button>
  <button class="st-btn st-btn-primary" type="button" disabled>Export</button>
</div>
<script>
  document.querySelectorAll('.st-btn').forEach(function (b) { window.Settle.press(b); });
</script>
</body>
</html>
